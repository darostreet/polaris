name: validar-nct-cache
on:
  push:
    branches: [validation/nct-cache-frescura]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BASE: 37d7339e4604abee7b13139b9a26196e33169b5b
      PARCHE: 3f10843fd8261f0c5da167d81a9c9a9a40452e26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dependencias del CI publico
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - name: Preparar dos arboles del mismo repositorio
        run: |
          git worktree add --detach "$RUNNER_TEMP/nct-base" "$BASE"
          git worktree add --detach "$RUNNER_TEMP/nct-parche" "$PARCHE"
          mkdir -p "$RUNNER_TEMP/nct-resultados"
      - name: Barrido y sintaxis del parche
        working-directory: ${{ runner.temp }}/nct-parche
        run: |
          python3 tools/ci_barrido.py --diff "$BASE...$PARCHE"
          python3 tools/ci_barrido.py --selftest
          python3 -m compileall -q tools tests pipeline evals
          git diff --check "$BASE" "$PARCHE"
      - name: Canario contra master sin el fix
        shell: bash
        run: |
          set -e
          cp "$RUNNER_TEMP/nct-base/tests/test_centinela_ned.py" "$RUNNER_TEMP/test_centinela_base_original.py"
          cp "$RUNNER_TEMP/nct-parche/tests/test_centinela_ned.py" "$RUNNER_TEMP/nct-base/tests/test_centinela_ned.py"
          set +e
          (
            cd "$RUNNER_TEMP/nct-base"
            HOME="$RUNNER_TEMP/home-canario" BTP_REPO="$RUNNER_TEMP/nct-base" \
              BTP_STATE_DIR="$RUNNER_TEMP/state-canario" python3 tests/test_centinela_ned.py
          ) >"$RUNNER_TEMP/canario.log" 2>&1
          rc=$?
          set -e
          cp "$RUNNER_TEMP/test_centinela_base_original.py" "$RUNNER_TEMP/nct-base/tests/test_centinela_ned.py"
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: los tests nuevos no detectan el bug en master"
            exit 1
          fi
          echo "Canario OK: master sin fix queda rojo como se esperaba (rc=$rc)"

      - name: Mutante deliberado del fix queda rojo
        shell: bash
        run: |
          set -e
          cp "$RUNNER_TEMP/nct-parche/tools/actualizar_nct_cache.py" "$RUNNER_TEMP/updater.bak"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"]) / "nct-parche/tools/actualizar_nct_cache.py"
          s=p.read_text()
          old='    if completo:\n        cache["_ts_consulta"] = datetime.now(tz=timezone.utc).isoformat(timespec="seconds")'
          new='    if True:\n        cache["_ts_consulta"] = datetime.now(tz=timezone.utc).isoformat(timespec="seconds")'
          if old not in s:
              raise SystemExit("ancla del mutante no encontrada")
          p.write_text(s.replace(old,new))
          PY
          set +e
          (
            cd "$RUNNER_TEMP/nct-parche"
            HOME="$RUNNER_TEMP/home-mutante" BTP_REPO="$RUNNER_TEMP/nct-parche" \
              BTP_STATE_DIR="$RUNNER_TEMP/state-mutante" python3 tests/test_centinela_ned.py
          ) >"$RUNNER_TEMP/mutante.log" 2>&1
          rc=$?
          set -e
          cp "$RUNNER_TEMP/updater.bak" "$RUNNER_TEMP/nct-parche/tools/actualizar_nct_cache.py"
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: el mutante que rejuvenece tras fallo no fue detectado"
            exit 1
          fi
          echo "Mutante OK: rejuvenecer el global tras fallo pone la suite roja (rc=$rc)"

      - name: Repetir entrada_guard aislado
        shell: bash
        run: |
          set -e
          for version in base parche; do
            root="$RUNNER_TEMP/nct-$version"
            echo "== $version =="
            for i in $(seq 1 20); do
              state=$(mktemp -d "$RUNNER_TEMP/entrada-$version-$i.XXXX")
              home=$(mktemp -d "$RUNNER_TEMP/home-entrada-$version-$i.XXXX")
              if ! (
                cd "$root"
                HOME="$home" BTP_REPO="$root" BTP_STATE_DIR="$state" BTP_TEST_BATTERY=1 BTP_PORTABLE=1 \
                  python3 tests/test_entrada_guard.py
              ) >"$RUNNER_TEMP/entrada-$version-$i.log" 2>&1; then
                echo "FALLO $version repeticion $i"
                cat "$RUNNER_TEMP/entrada-$version-$i.log"
                exit 1
              fi
            done
          done
      - name: Bateria completa antes y despues
        shell: bash
        run: |
          set +e
          for version in base parche; do
            root="$RUNNER_TEMP/nct-$version"
            mkdir -p "$RUNNER_TEMP/nct-resultados/$version" "$RUNNER_TEMP/nct-state-$version"
            (
              cd "$root" || exit 125
              BTP_REPO="$root" BTP_STATE_DIR="$RUNNER_TEMP/nct-state-$version"                 BTP_ROJO_DIR="$RUNNER_TEMP/nct-resultados/$version"                 BTP_TEST_BATTERY=1 BTP_PORTABLE=1                 timeout 1100 bash tests/test_all.sh
            ) > "$RUNNER_TEMP/nct-resultados/$version.log" 2>&1
            echo $? > "$RUNNER_TEMP/nct-resultados/$version.rc"
          done
      - name: Suite del centinela con dependencias reales del repo
        working-directory: ${{ runner.temp }}/nct-parche
        run: python3 tests/test_centinela_ned.py
      - name: Comparar fallos sin publicar logs crudos
        if: always()
        shell: python
        run: |
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nct-resultados'
          datos = {}
          for version in ('base', 'parche'):
              logfile, rcfile = root / (version + '.log'), root / (version + '.rc')
              if not logfile.exists() or not rcfile.exists():
                  raise SystemExit('Validacion incompleta: faltan resultados de ' + version)
              texto = logfile.read_text(errors='replace')
              datos[version] = {
                  'rc': int(rcfile.read_text()),
                  'ejecutadas': re.findall(r'^── ([^ ]+) ──', texto, re.M),
                  'rojas': sorted(set(re.findall(r'ROJO: ([^ ]+)', texto))),
                  'resumen': texto.splitlines()[-5:],
              }
          nuevas = sorted(set(datos['parche']['rojas']) - set(datos['base']['rojas']))
          faltan = sorted(set(datos['base']['ejecutadas']) - set(datos['parche']['ejecutadas']))
          resultado = {'base': os.environ['BASE'], 'parche': os.environ['PARCHE'],
                       'baterias_base': len(datos['base']['ejecutadas']),
                       'baterias_parche': len(datos['parche']['ejecutadas']),
                       'rojas_base': datos['base']['rojas'], 'rojas_parche': datos['parche']['rojas'],
                       'rojas_nuevas': nuevas, 'baterias_ausentes': faltan,
                       'rc_base': datos['base']['rc'], 'rc_parche': datos['parche']['rc']}
          print(json.dumps(resultado, indent=2))
          (root / 'comparacion.json').write_text(json.dumps(resultado, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Comparacion de regresiones NCT\n```json\n' + json.dumps(resultado, indent=2) + '\n```\n')
          if nuevas or faltan or not datos['base']['ejecutadas']:
              raise SystemExit('Hay fallos nuevos o la comparacion no se completo')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparacion-nct-cache
          path: ${{ runner.temp }}/nct-resultados/comparacion.json
