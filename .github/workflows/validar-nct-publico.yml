name: validar-nct-publico
on:
  push:
    branches: [validation/nct-cache-public]
permissions:
  contents: read
jobs:
  focal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git worktree add --detach "$RUNNER_TEMP/parche" 7e329bccd362e7ceeaad6b53fca6690072a57bf9
      - name: Tests NCT focales
        working-directory: ${{ runner.temp }}/parche
        run: |
          HOME="$RUNNER_TEMP/home-focal" BTP_REPO="$PWD" BTP_STATE_DIR="$RUNNER_TEMP/state-focal" \
            python3 tests/test_centinela_ned.py
      - name: Barrido y sintaxis
        working-directory: ${{ runner.temp }}/parche
        run: |
          python3 tools/ci_barrido.py --diff bfa1571345145634f5ebdb0ebb7bc86aa1ace91c...HEAD
          python3 tools/ci_barrido.py --selftest
          python3 -m compileall -q tools tests pipeline evals
          git diff --check bfa1571345145634f5ebdb0ebb7bc86aa1ace91c HEAD

  bateria-publica:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - run: git worktree add --detach "$RUNNER_TEMP/parche" 7e329bccd362e7ceeaad6b53fca6690072a57bf9
      - name: Bateria con el mismo entorno del CI publico
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/parche"
          BTP_PORTABLE=1 bash tests/test_all.sh > "$RUNNER_TEMP/bateria.log" 2>&1
          rc=$?
          set -e
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"]+"/bateria.log").read_text(errors="replace")
          rojos=sorted(set(re.findall(r"ROJO: ([^ ]+)", t)))
          esperados=sorted(["test_gate_punto08.py","test_gate_s15.py","test_radar_personas.py",
                            "test_secretos_largos_paralelo.py"])
          print("rojos:", rojos)
          print("esperados:", esperados)
          if rojos != esperados:
              raise SystemExit("el parche cambia el conjunto de rojos del master publico")
          PY
          echo "Mismo conjunto de rojos que master; rc original=$rc"
